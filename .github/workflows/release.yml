# A tag vX.Y.Z on a commit of main publishes debian-image-factory-X.Y.Z.pyz, its .sha256 and its Sigstore
# bundle as a GitHub release, and the builder image to ghcr.io signed with a keyless signature, once the
# full matrix and the integration tier passed. The .pyz is reproducible: scripts/build-pyz.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  matrix:
    name: Python ${{ matrix.python }}
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: apt and gpgv, which planning and the archive tests use
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends apt gpgv gnupg

      - name: Development tools, pinned with hashes
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Static checks
        run: scripts/test static

      - name: Unit tests
        run: scripts/test unit

  integration:
    name: integration tier
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: apt and gpgv, which planning and the archive tests use
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends apt gpgv gnupg

      - name: Integration tests (docker and the network)
        run: scripts/test integration

  publish:
    name: publish the release
    needs: [matrix, integration]
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release
      packages: write # the builder image on ghcr.io
      id-token: write # keyless Sigstore signing
    env:
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, to tell whether the tagged commit is on main
          persist-credentials: false

      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main" >&2; exit 1; }

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Build the .pyz
        run: scripts/build-pyz

      - name: The tag is the version in the .pyz
        run: |
          set -euo pipefail
          version=$(python3 dist/debian-image-factory-*.pyz --version | cut -d' ' -f2)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, .pyz $version" >&2; exit 1; }

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the .pyz, keyless
        run: |
          set -euo pipefail
          for pyz in dist/debian-image-factory-*.pyz; do
            cosign sign-blob --yes --bundle "$pyz.sigstore.json" "$pyz"
          done

      - name: Build the builder image, push it and sign it by digest, keyless
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$repository-builder"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # scripts/builder build prints the local image reference on its last line
          built=$(scripts/builder build | tail -n 1)
          docker tag "$built" "$image:$GITHUB_REF_NAME"
          docker push "$image:$GITHUB_REF_NAME"
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image:$GITHUB_REF_NAME" | grep -F "$image@" | head -n 1)
          test -n "$digest"
          cosign sign --yes "$digest"
          echo "The builder image is $digest, signed keyless with Sigstore." > dist/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/debian-image-factory-*.pyz dist/debian-image-factory-*.pyz.sha256 dist/debian-image-factory-*.pyz.sigstore.json \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --generate-notes
