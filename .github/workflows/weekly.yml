# Once a week: the static and unit tiers on every supported Python, 3.13 (Debian 13's) up to the newest
# stable, and on the next pre-release, which is allowed to fail: it warns weeks before a break matters.
# Runs on GitHub's hosted runners; see ci.yml.
name: weekly

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Python ${{ matrix.python }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event.repository.private && 'debian-image-factory' || 'ubuntu-26.04' }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
        experimental: [false]
        include:
          - python: "3.16.0a2"
            experimental: true
    steps:
      - name: System packages a bare runner lacks (git, gpgv, shellcheck and more)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends apt gpgv gnupg git ca-certificates curl xz-utils shellcheck

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true

      - name: Development tools, pinned with hashes
        run: uv pip install --require-hashes -r requirements-dev.txt

      - name: Static checks
        run: scripts/test static

      - name: Unit tests
        run: scripts/test unit
