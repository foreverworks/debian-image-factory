# Once a week: the static and unit tiers on every supported Python, 3.13 (Debian 13's) up to the newest
# stable, and on the next pre-release, which is allowed to fail: it warns weeks before a break matters.
name: weekly

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Python ${{ matrix.python }}
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
        experimental: [false]
        include:
          - python: "3.16.0-alpha.2"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: apt and gpgv, which planning and the archive tests use
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends apt gpgv gnupg

      - name: Development tools, pinned with hashes
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Static checks
        run: scripts/test static

      - name: Unit tests
        run: scripts/test unit
