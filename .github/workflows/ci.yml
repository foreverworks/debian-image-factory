# Every push and pull request: one job on the newest stable Python, with the static checks run against
# the oldest supported one (3.13) through mypy's python_version and ruff's target-version. The full
# matrix runs weekly (weekly.yml) and gates a release (release.yml). Nothing runs while the repository
# is private.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: static checks (3.13 floor) and unit tests on Python 3.15
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: apt and gpgv, which planning and the archive tests use
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends apt gpgv gnupg

      - name: Development tools, pinned with hashes
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Static checks
        run: scripts/test static

      - name: Unit tests
        run: scripts/test unit
