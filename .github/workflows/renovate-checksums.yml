name: renovate checksums

# Renovate moves a version in lock.json; the input-lock Action then rewrites the checksum of
# the moved entry and commits it to the same branch (DESIGN 9.2).
on:
  push:
    branches: ["renovate/**"]

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the Action compares the branch with its merge base
      - uses: foreverworks/input-lock@d2234a6d93e4e5dcf7b5472335e6acc4c2ac9777 # v0.2.0
