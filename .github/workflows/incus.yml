# The Incus boot contract (DESIGN 11, 12, 14's M4) on demand: `scripts/test incus` builds core, incus-base
# and an Incus child, runs every check on them, incus-boot and two-clones on an Incus host that
# scripts/incus-vm boots in a VM, and requires every check to pass. Run by hand from the Actions tab, and
# called by release.yml on a tag, where it gates the publish; the same command runs locally, under QEMU
# TCG when there is no /dev/kvm.
#
# Where it runs: see boot.yml. The VM uses the hosted runner's /dev/kvm.
name: incus

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  incus:
    name: Incus checks in a VM
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event.repository.private && 'debian-image-factory-kvm' || 'ubuntu-26.04' }}
    timeout-minutes: 90
    steps:
      - name: System packages a bare runner lacks (git, gpgv and more)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends apt gpgv gnupg git ca-certificates curl xz-utils debian-archive-keyring
          test -s /usr/share/keyrings/debian-archive-keyring.pgp || { echo "no Debian archive keyring at /usr/share/keyrings/debian-archive-keyring.pgp" >&2; exit 1; }

      # A world-writable socket is safe here: the runner is a fresh VM that runs this one job and is thrown away
      # after it, so no other user or job can reach the socket.
      - name: Docker, installed when the runner has none
        run: |
          command -v docker >/dev/null || sudo apt-get install -y -q --no-install-recommends docker.io
          docker info >/dev/null 2>&1 || sudo systemctl start docker >/dev/null 2>&1 || true
          docker info >/dev/null 2>&1 || sudo chmod 666 /var/run/docker.sock

      # The same holds for /dev/kvm: a single-job VM, nobody else on it.
      - name: KVM for the runner's user, when the machine has it
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "no /dev/kvm: the VM runs under TCG"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          activate-environment: true

      - name: The builder image
        run: scripts/builder build

      - name: The Incus boot contract for a base and a child
        run: scripts/test incus
