# Every night: the Action (action.yml, run as `uses: ./`) plans .github/nightly/factory.toml at the newest
# completed snapshot against a target that persists between nights, and builds, tests and publishes only what
# the plan says changed. A night with no relevant upload builds nothing and costs a few index downloads
# (DESIGN 9.3). It proves the Action on every kind it can without a registry, and the claim that a quiet night builds nothing.
#
# The target is a `dir://` directory kept in the Actions cache: the newest `nightly-` entry is restored, and a
# night that built something saves a new one. Nothing is published anywhere public (DESIGN 16.2).
# A night that built something also prunes the directory (`prune`: the newest 5 good builds and 1 candidate per
# image stay, nothing is pinned here), so the cache does not grow without end.
#
# Runs on GitHub's hosted runners; see ci.yml. The images are not booted here, so /dev/kvm is not needed.
name: nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: plan at the newest snapshot, build what changed
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !github.event.repository.fork
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: System packages a bare runner lacks (git, gpgv and more)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends apt gpgv gnupg git ca-certificates curl xz-utils debian-archive-keyring
          test -s /usr/share/keyrings/debian-archive-keyring.pgp || { echo "no Debian archive keyring at /usr/share/keyrings/debian-archive-keyring.pgp" >&2; exit 1; }

      # A world-writable socket is safe here: the runner is a fresh VM that runs this one job and is thrown away
      # after it, so no other user or job can reach the socket.
      - name: Docker, installed when the runner has none
        run: |
          command -v docker >/dev/null || sudo apt-get install -y -q --no-install-recommends docker.io
          docker info >/dev/null 2>&1 || sudo systemctl start docker >/dev/null 2>&1 || true
          docker info >/dev/null 2>&1 || sudo chmod 666 /var/run/docker.sock

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          activate-environment: true

      - name: Restore the target the last night that built something saved
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nightly-target
          key: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nightly-

      # The Action runs the release a lock pins; this repository's own lock names none yet, so it tests the
      # factory at this commit through the pyz input.
      - name: Build the .pyz of this commit
        id: pyz
        run: |
          set -euo pipefail
          path=$(scripts/build-pyz | tail -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Plan, and build, test and publish what changed
        id: factory
        uses: ./
        with:
          definition: .github/nightly/factory.toml
          lock: .github/nightly/lock.json
          snapshot: latest
          against: dir://${{ github.workspace }}/.nightly-target
          publish: true
          pyz: ${{ steps.pyz.outputs.path }}

      - name: Prune the target
        if: steps.factory.outputs.changed == 'true'
        env:
          PYZ: ${{ steps.pyz.outputs.path }}
          TARGET: dir://${{ github.workspace }}/.nightly-target
        run: |
          set -euo pipefail
          python3 "$PYZ" prune --against "$TARGET" --definition .github/nightly/factory.toml

      - name: Save the target
        if: steps.factory.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nightly-target
          key: nightly-${{ github.run_id }}-${{ github.run_attempt }}

      - name: What the night did
        if: always()
        env:
          CHANGED: ${{ steps.factory.outputs.changed }}
          ARTIFACTS: ${{ steps.factory.outputs.artifacts }}
        run: |
          {
            echo "changed: ${CHANGED:-unknown}"
            echo
            echo '```json'
            echo "${ARTIFACTS:-}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
