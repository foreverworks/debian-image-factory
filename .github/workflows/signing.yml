# Keyless signing for real (DESIGN 8.3): publish signs the records of a small image with this workflow's own OIDC
# identity through Sigstore, and verify checks them against that identity and GitHub's issuer. Fulcio and Rekor
# are the public-good instances, so every run writes entries to the public Rekor log, which is fine for a public
# repository and is why it runs on pushes to main only: a pull request from a fork gets no OIDC token, and
# should not write to the log either.
#
# Where it runs: on GitHub's hosted ubuntu-26.04 runners, free for a public repository. The tests that sign with a
# key run in the integration tier (integration.yml).
name: signing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keyless:
    name: keyless signature, signed and verified with this workflow's identity
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: System packages a bare runner lacks (git, envsubst for the cosign installer)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends git ca-certificates curl gettext-base

      # A world-writable socket is safe here: the runner is a fresh VM that runs this one job and is thrown away
      - name: Docker, installed when the runner has none
        run: |
          command -v docker >/dev/null || sudo apt-get install -y -q --no-install-recommends docker.io
          docker info >/dev/null 2>&1 || sudo systemctl start docker >/dev/null 2>&1 || true
          docker info >/dev/null 2>&1 || sudo chmod 666 /var/run/docker.sock

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          activate-environment: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.6

      - name: Sign keyless, verify with this workflow's identity
        env:
          DIF_INTEGRATION: "1"
          DIF_KEYLESS: "1"
        run: |
          set -euo pipefail
          python3 scripts/vendor-input-lock
          PYTHONPATH=src:.vendor python3 -m unittest -v tests.integration.test_signing.KeylessTest
